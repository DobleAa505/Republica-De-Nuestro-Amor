</style></head><body><div class="ambient"></div><div class="shell"><header class="topbar"><span>✦ ARCHIVO OFICIAL · 2022—2026</span><button id="musicBtn" aria-label="Activar o desactivar música">♫ Reproducir música</button></header><section id="cover" class="cover"><div class="coverbook"><div class="seal">REPÚBLICA DE NUESTRO AMOR</div><h1>Nuestros primeros<br>cuatro años</h1><div class="script">Jonathan & Ana</div><img class="coverimg" src="assets/photos/F27.jpg" alt="Jonathan y Ana" loading="eager"><div class="seal">8 OCTUBRE 2022 · 8 OCTUBRE 2026</div><p class="sub">Una colección de recuerdos, momentos y razones por las que todavía te escogería una y otra vez.</p><button class="goldbtn" id="open">ABRIR NUESTRO ÁLBUM ♡</button></div></section><main id="reader" class="reader hidden"><div class="progress" aria-label="Progreso de lectura"><div id="bar"></div></div><article class="paper" id="page" aria-live="polite"></article><nav class="nav"><button id="prev">← Anterior</button><span id="count" class="count"></span><button id="next">Siguiente →</button></nav><p class="footer">Jonathan Espinal ♡ Ana Velazco · Nuestra historia continúa</p></main></div><div id="burst" class="heartburst" aria-hidden="true"></div><audio id="bgMusic" loop preload="none"><source src="assets/mi-bendicion.mp3" type="audio/mpeg"></audio><script>

const special={16:['Nuestro primer Año Nuevo','Nuestro primer 31 de diciembre juntos, hasta el amanecer. No pudo haber mejor manera de recibir un nuevo año que a tu lado. Cada momento contigo hace que la noche valga la pena. ♥️'],18:['Un beso para siempre','Cómo olvidar el sabor de tu boca y la temperatura de tu cuerpo… Un beso nuestro, lleno de amor, de esos que quisiera guardar para siempre. ♥️'],19:['Nuestro 24 de diciembre','Un 24 de diciembre contigo nunca lo voy a olvidar. Y no importa si no hay sillas, porque tú, mi reina, siempre tendrás un lugar donde sentarte… conmigo. ♥️'],21:['Donde comenzó nuestra historia','Cómo olvidar los momentos tan lindos que el gym nos regaló, el lugar donde, sin saberlo, comenzó nuestra historia de amor. Desde ahí, cada momento contigo se convirtió en una parte de nuestra historia. ♥️'],27:['Nuestro primer viaje juntos','Nuestro primer viaje juntos, donde por primera vez compartimos lo que significa vivir bajo el mismo techo, compartir cada momento y sentir que, aunque seamos dos personas, somos una sola alma. ♥️']};
const vtext={1:['Entre salsa, merengue y nosotros dos','Mi amor, cómo olvidar aquel día después de tu práctica de voleibol, cuando decidimos pasar un rato tranquilo en la piscina. Y pensar que terminamos discutiendo si aquella canción era salsa o merengue, jajaja. Al final, la encontré y la puse para que bailáramos juntos.\n\nPorque contigo hasta una pequeña discusión termina convirtiéndose en un recuerdo bonito. Y si me preguntaran con quién quiero seguir bailando todas las canciones de mi vida, mi respuesta siempre serías tú.'],2:['Un cumpleaños que guardo en el corazón','Recuerdo aquel cumpleaños tuyo en el que nos pusimos tan bonitos para salir juntos. Fuimos a aquel restaurante que parecía una cueva y vivimos una noche llena de fotografías, sonrisas y momentos que todavía guardo con cariño.\n\nMi parte favorita fue poder compartirlo contigo. Espero que la vida me regale muchísimos cumpleaños más a tu lado, mi reina.'],3:['Una noche para reírnos juntos','¿Cómo olvidarnos de aquella noche en la discoteca? Jajajaja. Disfrutando, riéndonos y pasándola bien juntos.\n\nLo que más me gusta de este recuerdo no es la fiesta, sino que estábamos juntos, siendo nosotros mismos. Contigo hasta las noches más locas se convierten en recuerdos que quiero guardar.'],4:['Nuestra canción, nuestro mundo','Hay canciones que uno escucha y disfruta, pero también hay canciones que se convierten en recuerdos de una persona. Aquella noche, mientras cantábamos junticos una canción que tanto nos gusta, yo solamente quería disfrutar de tenerte tan cerca.\n\nOjalá nunca nos falten canciones para cantar abrazados.'],5:['El día que comenzó nuestro nosotros','El 8 de octubre de 2022, con la ayuda de tu hermana, preparé aquella sorpresa para pedirte que fueras mi novia. Recuerdo la ilusión y lo mucho que significaba para mí hacerte aquella pregunta.\n\nCuatro años después, si pudiera regresar a ese momento, volvería a preguntártelo. Porque después de cuatro años, sigo queriendo que seas tú. Siempre tú.'],6:['Nuestra primera salida, nuestro primer beso','Hay primeras veces que pasan y se olvidan, pero hay otras que se quedan guardadas para siempre. Nuestra primera salida juntos y aquel primer beso fueron el comienzo de tantos momentos hermosos.\n\nSi pudiera volver a vivir aquel primer beso, lo haría una y mil veces.'],7:['Una cita elegante, el mismo amor de siempre','Después de tantos años, todavía me emociona salir contigo como si fuera una de nuestras primeras citas. Aquella noche en la que nos arreglamos bonitos y salimos a comer sushi me recordó lo mucho que disfruto compartir mi tiempo contigo.\n\nQuiero seguir invitándote a salir, seguir conquistándote y seguir teniendo citas contigo.'],8:['Hasta desde lejos, quiero estar presente','Quizás parezca algo sencillo: una videollamada mientras buscabas qué ponerte para ir a un restaurante. Pero para mí significa mucho más.\n\nEl amor también está en esas llamadas, en las pequeñas decisiones y en encontrar maneras de estar presentes aunque nos separen kilómetros.']};
add('CAPÍTULO I · DONDE TODO COMENZÓ','Antes de todos estos recuerdos','Toda gran historia tiene un comienzo. La nuestra tiene miradas, nervios, un primer beso y una pregunta que cambió nuestras vidas.',[23,24]);
add('CAPÍTULO I',vtext[6][0],vtext[6][1],[],6);add('CAPÍTULO I',special[21][0],special[21][1],[21]);add('CAPÍTULO I · 8 DE OCTUBRE DE 2022',vtext[5][0],vtext[5][1],[],5);
add('CAPÍTULO II · NUESTROS MOMENTOS','Lo extraordinario de lo cotidiano','Algunos recuerdos son grandes planes. Otros son simplemente nosotros dos. Y todos tienen algo en común: tú.',[1,2,3,4]);
add('CAPÍTULO II',special[18][0],special[18][1],[18]);add('CAPÍTULO II',special[27][0],special[27][1],[27]);add('CAPÍTULO II',vtext[1][0],vtext[1][1],[],1);
add('CAPÍTULO III · AMOR A DISTANCIA','El amor también aprendió a viajar','No siempre hemos tenido la suerte de estar a pocos minutos uno del otro. Hemos aprendido a querernos desde kilómetros de distancia, a extrañarnos y a esperar el próximo abrazo. Pero estar lejos de ti nunca hizo que te sintiera menos cerca de mi corazón.',[22,31,37]);add('CAPÍTULO III',vtext[8][0],vtext[8][1],[],8);
add('CAPÍTULO IV · GRANDES RECUERDOS',special[19][0],special[19][1],[19]);add('CAPÍTULO IV',special[16][0],special[16][1],[16]);add('CAPÍTULO IV','Las sonrisas que quiero guardar','Hay fotografías que nos devuelven de golpe a un momento feliz. Estas son algunas de las nuestras.',[5,6,7,8]);add('CAPÍTULO IV','Nuestra forma de querernos','Entre abrazos, risas y días que parecían normales, fuimos construyendo algo inmenso.',[9,10,11,12]);add('CAPÍTULO IV','Más recuerdos, más nosotros','Porque no hay una sola fotografía capaz de contar todo lo que hemos vivido.',[13,14,15,17]);add('CAPÍTULO IV','Pequeños instantes','No necesito que cada foto sea perfecta. Me basta con que al mirarla estemos nosotros.',[20,25,26,28]);add('CAPÍTULO IV','Recuerdos para volver','Que nunca nos falten días que queramos recordar.',[29,30,32,33]);add('CAPÍTULO IV','Momentos que son nuestros','Una vida se construye con instantes como estos.',[34,35,36,38]);
add('CAPÍTULO V · RECUERDOS EN MOVIMIENTO',vtext[2][0],vtext[2][1],[],2);add('CAPÍTULO V',vtext[3][0],vtext[3][1],[],3);add('CAPÍTULO V','Disfrutando canciones como solo nosotros',vtext[4][1],[],4);add('CAPÍTULO V',vtext[7][0],vtext[7][1],[],7);
add('CAPÍTULO VI · COSAS QUE QUIZÁS NUNCA TE DIGO SUFICIENTE','Seis gracias que quiero darte','Toca cada tarjeta. Hay cosas que merecen decirse más de una vez.',[39]);
add('CAPÍTULO VII · CUATRO AÑOS EN FOTOS','Cómo hemos cambiado','No hace falta recordar la fecha exacta de cada imagen para ver todo lo que hemos crecido. Desde aquellos primeros días hasta hoy, cada versión de nosotros forma parte de esta historia.',[1,14,27,38]);
add('CAPÍTULO VIII · TODAVÍA NOS QUEDA MUCHO POR VIVIR','Esto apenas comienza','Todavía quiero conocer contigo lugares donde nunca hemos estado. Más viajes. Más cumpleaños. Más atardeceres. Más noches hablando hasta quedarnos dormidos.\n\nPorque estos cuatro años me enseñaron que no quiero solamente recordar una vida contigo. Quiero seguir construyéndola contigo.',[27]);

let current=0,approved=false,userPausedMusic=false;function playMusic(){music.volume=.28;music.play().then(()=>$('musicBtn').textContent='♫ Pausar música').catch(()=>$('musicBtn').textContent='♫ Activar música')} const $=id=>document.getElementById(id),reader=$('reader'),page=$('page'),music=$('bgMusic');

function render(){stopVideo();page.replaceChildren();page.className='paper';const p=pages[current];$('bar').style.width=((current+1)/pages.length*100)+'%';$('count').textContent=`${current+1} / ${pages.length}`;$('prev').disabled=current===0;$('next').disabled=(p.kind==='renew'&&!approved)||current===pages.length-1;
if(p.kind){page.classList.add('photoOnly');const area=el('div','endpage');page.appendChild(area);if(p.kind==='renew'){addText(area,'div','eyebrow','DOCUMENTO OFICIAL · 8 OCTUBRE 2026');addText(area,'h2','','Renovación del acuerdo ♡');addText(area,'p','','Relación: Jonathan ❤️ Ana\nInicio: 8 de octubre de 2022\nPeríodo completado: 4 años\nEstado: vigente');addText(area,'p','','Después de cuatro años de amor, distancia, risas, recuerdos, conversaciones y tantos momentos… tengo clarísimo lo que quiero. Pero esta vez quiero preguntártelo a ti.');addText(area,'h2','','Ana, ¿quieres renovar nuestra relación por otros cuatro años?');const choices=el('div','choices');area.appendChild(choices);const yes=el('button','goldbtn','SÍ, QUIERO ❤️'),no=el('button','no','NO');choices.append(yes,no);yes.onclick=()=>{approved=true;current++;render();burst()};let attempts=0;no.onclick=()=>{no.textContent=['¿Estás segura? 😭','Piénsalo otra vez 🥺','Ese botón está en revisión 😂❤️'][Math.min(attempts++,2)]}}else if(p.kind==='approved'){addText(area,'div','eyebrow','ARCHIVO OFICIAL · RESOLUCIÓN FAVORABLE');addText(area,'h2','','RENOVACIÓN APROBADA ❤️');addText(area,'div','script','2026 — 2030');addText(area,'p','','Firmado:\nJonathan Espinal ❤️ Ana Velazco\n\nY espero que cuando lleguemos a 2030 volvamos a hacernos exactamente la misma pregunta. ¿Renovamos otra vez? ❤️');const b=el('button','goldbtn','Volver a ver nuestro álbum ↺');area.appendChild(b);b.onclick=()=>{current=0;render()};const s=el('button','no','Una última bendición ✨');s.style.marginTop='18px';area.appendChild(s);s.onclick=()=>{current++;render()}}else{addText(area,'div','eyebrow','UNA ÚLTIMA BENDICIÓN');addText(area,'h2','','Una última bendición');addText(area,'p','','«Que nuestros planes se cumplan, pero que por encima de ellos, se cumplan los planes de Dios, porque los planes de él son más grandes y mejores.»');addText(area,'p','','Inspirado en Jeremías 29:11 · Que Dios siga guiando nuestros pasos. ❤️');const b=el('button','goldbtn','Volver al comienzo ♡');area.appendChild(b);b.onclick=()=>{current=0;render()}}return}
const visual=el('div','visual'),content=el('div','content');page.append(visual,content);if(p.vid){const v=el('video');v.controls=true;v.preload='metadata';v.playsInline=true;v.src=video(p.vid);v.setAttribute('aria-label',p.title);v.addEventListener('play',()=>music.pause());v.addEventListener('ended',()=>{if(!userPausedMusic)playMusic()});v.addEventListener('pause',()=>{if(!userPausedMusic && !v.ended)playMusic()});visual.appendChild(v)}else if(p.photos.length>1){const grid=el('div','mosaic');p.photos.forEach(n=>{const im=el('img');im.src=photo(n);im.alt='Recuerdo fotográfico '+n;im.loading='lazy';grid.appendChild(im)});visual.appendChild(grid)}else if(p.photos.length===1){const im=el('img');im.src=photo(p.photos[0]);im.alt=p.title;visual.appendChild(im)}addText(content,'div','eyebrow',p.chapter);addText(content,'h2','',p.title);addText(content,'p','',p.body);if(p.chapter.startsWith('CAPÍTULO VI')){const notes=el('div','notes');content.appendChild(notes);[['Gracias por quedarte','Por seguir eligiéndonos incluso cuando las cosas no son fáciles.'],['Gracias por entenderme','Por escucharme y hacerme sentir acompañado.'],['Gracias por crecer conmigo','Por todos los cambios y aprendizajes que hemos compartido.'],['Gracias por hacerme sentir amado','Por tus detalles, tus abrazos y tu manera de quererme.'],['Gracias por cada recuerdo','Por cada día que se convirtió en parte de nuestra historia.'],['Gracias por ser tú','Porque no cambiaría nuestra historia por ninguna otra.']].forEach(([a,b],i)=>{const bt=el('button','note');const st=el('strong','',String(i+1).padStart(2,'0')+' · '+a);bt.appendChild(st);bt.onclick=()=>{let msg=bt.querySelector('span');if(msg)msg.remove();else bt.appendChild(el('span','',b))};notes.appendChild(bt)})}addText(content,'div','folio','NUESTRO ÁLBUM · JONATHAN & ANA')}
function go(delta){const next=current+delta;if(next<0||next>=pages.length)return;if(delta>0&&pages[current].kind==='renew'&&!approved)return;current=next;render();window.scrollTo({top:0,behavior:'smooth'})}
$('open').onclick=()=>{$('cover').classList.add('hidden');reader.classList.remove('hidden');render();userPausedMusic=false;playMusic()};$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);document.addEventListener('keydown',e=>{if(reader.classList.contains('hidden'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});let startX=0;page.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});page.addEventListener('touchend',e=>{if(e.target.closest('video,button'))return;const dx=e.changedTouches[0].screenX-startX;if(Math.abs(dx)>90)go(dx<0?1:-1)},{passive:true});$('musicBtn').onclick=()=>{if(music.paused){userPausedMusic=false;playMusic()}else{userPausedMusic=true;music.pause();$('musicBtn').textContent='♫ Reproducir música'}};function burst(){const box=$('burst');for(let i=0;i<26;i++){const h=el('span','','♥');h.style.left=Math.random()*100+'%';h.style.color=['#bd7cbb','#d6a565','#d28c9b'][i%3];h.style.fontSize=(15+Math.random()*24)+'px';h.style.animationDelay=(Math.random()*1.3)+'s';box.appendChild(h);setTimeout(()=>h.remove(),5500)}}
document.addEventListener('DOMContentLoaded',()=>{playMusic()});</script></body></html>
